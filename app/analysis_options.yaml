include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "build/**"
    - ".dart_tool/**"
  errors:
    # Flutter 3.50 marks the long-standing Material imports and DropdownButton
    # `value` parameter as deprecated. Keep compatibility with older SDKs.
    deprecated_member_use: ignore

linter:
  rules:
    prefer_const_constructors: true
    prefer_final_fields: true
    avoid_print: true
