name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build release APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: |
          flutter create --org app.taplock --project-name taplock \
            --platforms=android "$RUNNER_TEMP/taplock_platforms"
          cp -R "$RUNNER_TEMP/taplock_platforms/android" app/
          cp -R platform_overlays/android/. app/android/

      - name: Create demo signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/taplock.jks" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug, O=Android, C=US"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/taplock.jks" >> "$GITHUB_ENV"

      - name: Enable V1 + V2 signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("app/android/app/build.gradle.kts"),
              Path("app/android/app/build.gradle"),
          ]
          p = next((c for c in candidates if c.exists()), None)
          if p is None:
              raise SystemExit("No build.gradle(.kts) found")
          s = p.read_text()

          if p.suffix == ".kts":
              s = s.replace("android {\n", """android {
                  signingConfigs {
                      create("release") {
                          storeFile = file(System.getenv("KEYSTORE_FILE")!!)
                          storePassword = "android"
                          keyAlias = "androiddebugkey"
                          keyPassword = "android"
                          isV1SigningEnabled = true
                          isV2SigningEnabled = true
                      }
                  }
              """, 1)
              s = s.replace(
                  'signingConfig = signingConfigs.getByName("debug")',
                  'signingConfig = signingConfigs.getByName("release")',
                  1,
              )
              s = s.replace(
                  'getByName("release") {',
                  'getByName("release") {\n'
                  '            signingConfig = signingConfigs.getByName("release")',
                  1,
              )
          else:
              s = s.replace("android {\n", """android {
                  signingConfigs {
                      release {
                          storeFile file(System.getenv("KEYSTORE_FILE"))
                          storePassword "android"
                          keyAlias "androiddebugkey"
                          keyPassword "android"
                          v1SigningEnabled true
                          v2SigningEnabled true
                      }
                  }
              """, 1)
              s = s.replace(
                  "signingConfig signingConfigs.debug",
                  "signingConfig signingConfigs.release",
                  1,
              )

          p.write_text(s)
          print("Patched", p)
          PY

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build universal and per-ABI APKs
        working-directory: app
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi
          flutter build apk --debug

      - name: Stage and upload APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version:' app/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          TAG="v$VERSION"
          OUT=app/build/app/outputs/flutter-apk
          cp "$OUT/app-release.apk" "taplock-$VERSION.apk"
          cp "$OUT/app-armeabi-v7a-release.apk" "taplock-$VERSION-armeabi-v7a.apk"
          cp "$OUT/app-arm64-v8a-release.apk" "taplock-$VERSION-arm64-v8a.apk"
          cp "$OUT/app-x86_64-release.apk" "taplock-$VERSION-x86_64.apk"
          cp "$OUT/app-debug.apk" "taplock-$VERSION-debug.apk"
          for f in taplock-*.apk; do
            echo "Uploading $f"
            gh release upload "$TAG" "$f" --clobber
          done
          echo "ASSETS=taplock-$VERSION.apk,taplock-$VERSION-arm64-v8a.apk,taplock-$VERSION-armeabi-v7a.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: taplock-apks
          path: taplock-*.apk
          if-no-files-found: error
